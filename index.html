<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإنذار المبكر</title>

    <!-- الكود الرسمي المحدث لـ OneSignal v16 بالمفتاح الجديد -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "2ed10d9f-2916-4a31-927b-6a2bea7064da",
        });
      });
    </script>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .warning-icon {
            font-size: 50px;
            color: #eab308; /* أيقونة التعجب الصفراء المطلوبة */
            margin-bottom: 15px;
        }
        h2 {
            margin-top: 0;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- أيقونة التعجب الصفراء -->
        <div class="warning-icon">&#9888;</div>
        <h2>نظام الإنذار المبكر</h2>
        <p>الرجاء تفعيل الإشعارات لضمان ربط جهازك واستلام التنبيهات الفورية بدقة.</p>
        
        <button onclick="subscribeUser()">تفعيل الإشعارات الآن</button>
    </div>

    <script>
        function subscribeUser() {
            window.OneSignalDeferred.push(async function(OneSignal) {
                try {
                    await OneSignal.Slidedown.promptPush();
                } catch (e) {
                    console.error("خطأ في الطلب:", e);
                }
            });
        }
    </script>

    <footer style="position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 12px; color: #64748b;">
        Rights Reserved &copy; sulaiman alnasiri
    </footer>
</body>
</html>
