<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإنذار المبكر - لوحة العمليات</title>

    <!-- شعار الشاشة الرئيسية والأيقونة المخصصة -->
    <link rel="apple-touch-icon" href="https://png.pngtree.com/png-vector/20250930/ourlarge/pngtree-yellow-warning-sign-with-exclamation-png-image_17618561.webp">
    <link rel="icon" type="image/png" href="https://png.pngtree.com/png-vector/20250930/ourlarge/pngtree-yellow-warning-sign-with-exclamation-png-image_17618561.webp">

    <!-- Firebase SDK (v9 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // إعدادات فايربيس (تأكد من مطابقتها لمشروعك)
        const firebaseConfig = {
            apiKey: "AIzaSyD-Your-Firebase-ApiKey-Here",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.query = query;
        window.orderBy = orderBy;
        window.serverTimestamp = serverTimestamp;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.onSnapshot = onSnapshot;

        // الاستماع الفوري لحالة الشاشة العامة (اللون والتنبيهات) من فايربيس لكل المستخدمين
        document.addEventListener("DOMContentLoaded", () => {
            if(window.db) {
                // مراقبة لون الشاشة العام
                window.onSnapshot(window.doc(window.db, "settings", "globalState"), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        applyScreenColor(data.screenColor || "white");
                        if(data.activeAlert) {
                            showGlobalAlertBanner(data.activeAlert);
                        } else {
                            hideGlobalAlertBanner();
                        }
                    }
                });
            }
        });
    </script>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f8fafc; /* خلفية الشاشة الرئيسية بيضاء / رمادي فاتح جداً */
            color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .top-admin-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
        }
        .admin-trigger-btn {
            background: #0f172a;
            color: #eab308;
            border: 2px solid #eab308;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .admin-trigger-btn:hover {
            background: #1e293b;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .warning-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
        }
        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            font-size: 13px;
            color: #334155;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        .emergency-btn {
            background: #dc2626 !important;
        }
        .emergency-btn:hover {
            background: #b91c1c !important;
        }
        .hidden {
            display: none;
        }
        .section-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #e2e8f0;
            text-align: right;
        }
        /* بانر التنبيه العاجل العلوي */
        #globalAlertBanner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #dc2626;
            color: white;
            padding: 12px 20px;
            text-align: center;
            font-weight: bold;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
            box-sizing: border-box;
        }
        #globalAlertBanner button {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 2px 8px;
            margin-right: 15px;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- بانر الإنذار العام من الأدمن -->
    <div id="globalAlertBanner">
        <span id="alertBannerText">تنبيه عاجل: ...</span>
        <button onclick="dismissGlobalAlert()">إغلاق (X)</button>
    </div>

    <!-- زر الأدمن في الأعلى -->
    <div class="top-admin-bar">
        <button class="admin-trigger-btn" onclick="openAdminPortal()">👑 الإدارة (Admin)</button>
    </div>

    <div class="card">
        <!-- الصورة المطلوبة لأيقونة التحذير -->
        <img src="https://png.pngtree.com/png-vector/20250930/ourlarge/pngtree-yellow-warning-sign-with-exclamation-png-image_17618561.webp" alt="تحذير" class="warning-img">
        <h2>نظام الإنذار المبكر</h2>

        <!-- خطوة 1: تسجيل الدخول (الاسم، البريد، الجوال) -->
        <div id="loginSection">
            <p>الرجاء إدخال بياناتك الشخصية للوصول إلى النظام وإرسال بلاغات الطوارئ بدقة.</p>
            <div class="input-group">
                <label>الاسم الكامل:</label>
                <input type="text" id="userName" placeholder="أدخل اسمك..." />
            </div>
            <div class="input-group">
                <label>البريد الإلكتروني:</label>
                <input type="email" id="userEmail" placeholder="name@example.com" />
            </div>
            <div class="input-group">
                <label>رقم الجوال:</label>
                <input type="text" id="userPhone" placeholder="05xxxxxxxx" />
            </div>
            <button onclick="handleLogin()">دخول النظام</button>
        </div>

        <!-- خطوة 2: لوحة العمليات الرئيسية -->
        <div id="dashboardSection" class="hidden">
            <p id="welcomeMsg" style="color: #0284c7; font-weight: bold;"></p>
            
            <div class="section-box">
                <label style="color: #dc2626; font-weight: bold;">منطقة الطوارئ القصوى:</label>
                <p style="font-size: 12px; color: #475569;">بالضغط أدناه سيتم تحويلك فوراً إلى الواتساب مع إرسال كافة بياناتك الشخصية وموقعك:</p>
                <button class="emergency-btn" onclick="triggerEmergencyWhatsApp()">🚨 إرسال بلاغ طوارئ عبر WhatsApp</button>
            </div>

            <!-- لوحة تحكم الأدمن (تظهر بعد إدخال رمز 13121312) -->
            <div id="adminPanel" class="section-box hidden" style="border-color: #eab308; background: #fffbeb;">
                <label style="color: #b45309; font-weight: bold;">👑 لوحة تحكم الأدمن المركزية</label>
                
                <div class="input-group" style="margin-top: 10px;">
                    <label>نشر إنذار عاجل لجميع المستخدمين:</label>
                    <input type="text" id="adminAlertInput" placeholder="اكتب نص الإنذار الرئيسي..." />
                </div>
                <button style="background: #eab308; color: #0f172a;" onclick="adminPublishAlert()">نشر الإنذار على الشاشة الرئيسية</button>
                <button style="background: #64748b; color: white;" onclick="adminClearAlert()">حذف ونفي الإنذار الحالي</button>

                <hr style="margin: 15px 0; border: 0; border-top: 1px solid #fcd34d;">
                
                <label style="color: #b45309; font-weight: bold;">التحكم بلون الشاشة لجميع المستخدمين:</label>
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <button style="background: #ffffff; color: #0f172a; border: 1px solid #cbd5e1;" onclick="adminSetColor('white')">أبيض بالكامل</button>
                    <button style="background: #16a34a; color: white;" onclick="adminSetColor('green')">أخضر بالكامل</button>
                    <button style="background: #dc2626; color: white;" onclick="adminSetColor('red')">أحمر بالكامل</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = { name: "", email: "", phone: "" };

        function handleLogin() {
            const name = document.getElementById("userName").value.trim();
            const email = document.getElementById("userEmail").value.trim();
            const phone = document.getElementById("userPhone").value.trim();

            if (!name || !email || !phone) {
                alert("الرجاء تعبئة جميع الحقول (الاسم، البريد، ورقم الجوال) للمتابعة!");
                return;
            }

            currentUser = { name, email, phone };

            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("dashboardSection").classList.remove("hidden");
            document.getElementById("welcomeMsg").innerText = `مرحباً بك، ${name}`;
        }

        function openAdminPortal() {
            const pass = prompt("الرجاء إدخال رمز دخول الأدمن:");
            if (pass === "13121312") {
                document.getElementById("dashboardSection").classList.remove("hidden");
                document.getElementById("adminPanel").classList.remove("hidden");
                alert("تم التحقق بنجاح! أهلاً بك في لوحة تحكم الأدمن.");
            } else if (pass !== null) {
                alert("رمز الدخول غير صحيح!");
            }
        }

        // إرسال البلاغ عبر الواتساب برقمك والمعلومات الكاملة
        function triggerEmergencyWhatsApp() {
            if (!currentUser.name) {
                alert("الرجاء تسجيل الدخول أولاً لتضمين البيانات في البلاغ.");
                return;
            }

            const targetPhone = "966500919401"; // رقمك المطلوب
            const message = `🚨 *تنبيه طارئ وعاجل من نظام الإنذار المبكر* 🚨\n\n` +
                            `👤 *اسم المستخدم:* ${currentUser.name}\n` +
                            `📧 *البريد الإلكتروني:* ${currentUser.email}\n` +
                            `📱 *رقم الجوال:* ${currentUser.phone}\n` +
                            `🔗 *رابط الموقع:* ${window.location.href}\n\n` +
                            `أطلب التدخل الفوري والمساعدة العاجلة!`;

            const whatsappUrl = `https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // وظائف الأدمن لحفظ الحالات في Firebase لجميع المستخدمين
        async function adminPublishAlert() {
            const alertText = document.getElementById("adminAlertInput").value.trim();
            if(!alertText) {
                alert("اكتب نص الإنذار أولاً!");
                return;
            }
            try {
                const docRef = window.doc(window.db, "settings", "globalState");
                const snap = await window.getDoc(docRef);
                let currentColor = "white";
                if(snap.exists()) currentColor = snap.data().screenColor || "white";

                await window.setDoc(docRef, {
                    activeAlert: alertText,
                    screenColor: currentColor
                }, { merge: true });
                alert("تم نشر الإنذار للشاشة الرئيسية لجميع المستخدمين بنجاح!");
                document.getElementById("adminAlertInput").value = "";
            } catch(e) {
                console.error(e);
                alert("خطأ أثناء النشر في قاعدة البيانات.");
            }
        }

        async function adminClearAlert() {
            try {
                const docRef = window.doc(window.db, "settings", "globalState");
                const snap = await window.getDoc(docRef);
                let currentColor = "white";
                if(snap.exists()) currentColor = snap.data().screenColor || "white";

                await window.setDoc(docRef, {
                    activeAlert: "",
                    screenColor: currentColor
                }, { merge: true });
                alert("تم إزالة الإنذار.");
            } catch(e) {
                console.error(e);
            }
        }

        async function adminSetColor(colorType) {
            try {
                const docRef = window.doc(window.db, "settings", "globalState");
                const snap = await window.getDoc(docRef);
                let currentAlert = "";
                if(snap.exists()) currentAlert = snap.data().activeAlert || "";

                await window.setDoc(docRef, {
                    activeAlert: currentAlert,
                    screenColor: colorType
                }, { merge: true });
                alert(`تم تغيير لون الشاشة لجميع المستخدمين إلى (${colorType}) بنجاح!`);
            } catch(e) {
                console.error(e);
                alert("حدث خطأ أثناء تحديث لون الشاشة.");
            }
        }

        // تطبيق لون الشاشة محلياً لكل مستخدم
        function applyScreenColor(colorType) {
            const body = document.body;
            const card = document.querySelector(".card");
            
            if (colorType === "green") {
                body.style.background = "#16a34a";
                body.style.color = "#ffffff";
                card.style.background = "#15803d";
                card.style.color = "#ffffff";
                card.style.borderColor = "#22c55e";
            } else if (colorType === "red") {
                body.style.background = "#dc2626";
                body.style.color = "#ffffff";
                card.style.background = "#b91c1c";
                card.style.color = "#ffffff";
                card.style.borderColor = "#ef4444";
            } else {
                // الوضع الافتراضي الأبيض
                body.style.background = "#f8fafc";
                body.style.color = "#0f172a";
                card.style.background = "#ffffff";
                card.style.color = "#0f172a";
                card.style.borderColor = "#e2e8f0";
            }
        }

        function showGlobalAlertBanner(text) {
            const banner = document.getElementById("globalAlertBanner");
            document.getElementById("alertBannerText").innerText = "⚠️ تنبيه عاجل: " + text;
            banner.style.display = "block";
        }

        function hideGlobalAlertBanner() {
            const banner = document.getElementById("globalAlertBanner");
            banner.style.display = "none";
        }

        function dismissGlobalAlert() {
            hideGlobalAlertBanner();
        }
    </script>

    <footer style="position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 12px; color: #64748b;">
        Rights Reserved &copy; sulaiman alnasiri
    </footer>
</body>
</html>
